name: Tests

on:
  push:
  pull_request:

jobs:
  macos:
    name: TrackerCore on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift test --package-path TrackerCore

  linux:
    name: TrackerCore on Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift test --package-path TrackerCore
