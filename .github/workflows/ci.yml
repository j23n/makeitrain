# The shared Linux and macOS jobs (j23n/apple-ci), which run `make ci-linux` and `make ci-macos`,
# and one more: the packages built and tested with Xcode 16 on macOS 15, so the macOS 15 SDK
# still compiles them while the apps build with Xcode 26.
name: CI

# apple-ci's workflows run each job once per commit: Linux on every push, macOS on pull requests,
# pushes to main and runs by hand (Actions › CI › Run workflow), as its README's "When CI runs" says.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: j23n/apple-ci/.github/workflows/linux.yml@main
    with:
      name: Linux · TrackerCore

  macos:
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: macOS · packages and app (iOS Simulator and Mac)

  packages-xcode-16:
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: macOS 15 · packages with Xcode 16
      runner: macos-15
      xcode: "16"
      brew: ""
      run: make test
