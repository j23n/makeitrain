# Claude reviews every pull request that isn't a draft and posts its findings as
# comments; its allowed tools can't edit files or push. It runs on Linux minutes.
# Needs the Claude GitHub App on the repository and the CLAUDE_CODE_OAUTH_TOKEN
# secret (from `claude setup-token`), the same one the claude workflow uses.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}

            Review this pull request for the Time Tracker repo. Read README.md and docs/architecture.md first, then the diff
            (gh pr diff ${{ github.event.pull_request.number }}) and the docs it touches or relies on (docs/behavior.md,
            docs/data-format.md, docs/sync.md).
            Check: correctness bugs, with the inputs that trigger them; a change to the files' format or to behaviour updates
            those docs; the app touches the network only for Debug builds' feedback; nothing personal reaches a feedback
            screenshot; TrackerCore still builds and tests on Linux; tests would fail if the behaviour broke.

            Post inline comments for specific lines, then one summary comment with gh pr comment: a verdict (pass/fail)
            and numbered findings marked [blocking] or [minor], each with file:line, the problem and a concrete fix.
            Do not modify files.
          claude_args: >-
            --model claude-opus-5-5
            --effort high
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
