# The Xcode project is generated from this file with XcodeGen: `make project` (or
# `xcodegen generate`). The project itself is not in git.
#
# It reproduces the hand-made project it replaced setting for setting: one target that builds
# the Mac app and the iPhone and iPad app, the iOS widget extension embedded in the iOS app
# only, and the TrackerKit package. The folders are synchronized folders, so this file lists
# no source files and changes only when the project's shape or a setting does. The two
# Info.plists sit in Config/, outside every target folder, so no folder copies them in as a
# resource.
name: TimeTracker

options:
  minimumXcodeGenVersion: "2.46.0"
  defaultConfig: Release
  projectFormat: xcode16_0
  defaultSourceDirectoryType: syncedFolder
  developmentLanguage: en
  # Nothing is added that isn't written here, so the warnings don't depend on the version of
  # XcodeGen that generated the project.
  settingPresets: none

attributes:
  BuildIndependentTargetsInParallel: 1
  LastSwiftUpdateCheck: 1600
  LastUpgradeCheck: 1600

configs:
  Debug: debug
  Release: release

# Your team, from the gitignored Signing.xcconfig at the root (make signing TEAM=…). No target
# sets DEVELOPMENT_TEAM itself, since a target's own setting would win over it.
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

fileGroups:
  - Config
  - project.yml

packages:
  TrackerKit:
    path: Packages/TrackerKit

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: "NO"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    CLANG_ANALYZER_NONNULL: "YES"
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    CLANG_ENABLE_MODULES: "YES"
    CLANG_ENABLE_OBJC_ARC: "YES"
    CLANG_ENABLE_OBJC_WEAK: "YES"
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: "YES"
    CLANG_WARN_BOOL_CONVERSION: "YES"
    CLANG_WARN_COMMA: "YES"
    CLANG_WARN_CONSTANT_CONVERSION: "YES"
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: "YES"
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: "YES"
    CLANG_WARN_EMPTY_BODY: "YES"
    CLANG_WARN_ENUM_CONVERSION: "YES"
    CLANG_WARN_INFINITE_RECURSION: "YES"
    CLANG_WARN_INT_CONVERSION: "YES"
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: "YES"
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: "YES"
    CLANG_WARN_OBJC_LITERAL_CONVERSION: "YES"
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: "YES"
    CLANG_WARN_RANGE_LOOP_ANALYSIS: "YES"
    CLANG_WARN_STRICT_PROTOTYPES: "YES"
    CLANG_WARN_SUSPICIOUS_MOVE: "YES"
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: "YES"
    CLANG_WARN__DUPLICATE_METHOD_MATCH: "YES"
    COPY_PHASE_STRIP: "NO"
    ENABLE_STRICT_OBJC_MSGSEND: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: "YES"
    GCC_WARN_64_TO_32_BIT_CONVERSION: "YES"
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: "YES"
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: "YES"
    GCC_WARN_UNUSED_VARIABLE: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    MTL_FAST_MATH: "YES"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: "YES"
      GCC_DYNAMIC_NO_PIC: "NO"
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: "YES"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_NS_ASSERTIONS: "NO"
      MTL_ENABLE_DEBUG_INFO: "NO"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  # The Mac app and the iPhone and iPad app, from one target.
  TimeTracker:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    productName: Time Tracker
    sources:
      - App
      - Shared
    # The build number: the number of commits, set when the bundle is built (j23n/apple-ci
    # README.md, "Build numbers"). The script reads .git, hence no script sandbox here.
    postBuildScripts:
      - name: Build number
        script: '"$SRCROOT/.apple-ci/build-number.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    dependencies:
      # The widget extension (the Live Activity and the controls) is iOS only.
      - target: TimeTrackerWidgets
        embed: true
        codeSign: false
        destinationFilters: [iOS]
      - package: TrackerKit
        product: MacUI
      - package: TrackerKit
        product: MobileUI
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/TimeTracker-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/TimeTracker-macOS.entitlements
        CODE_SIGN_STYLE: Automatic
        "COMBINE_HIDPI_IMAGES[sdk=macosx*]": "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CURRENT_PROJECT_VERSION: "1"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": "YES"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/TimeTracker-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Time Tracker"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        "INFOPLIST_KEY_LSUIElement[sdk=macosx*]": "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        "INFOPLIST_KEY_NSSupportsLiveActivities[sdk=iphoneos*]": "YES"
        "INFOPLIST_KEY_NSSupportsLiveActivities[sdk=iphonesimulator*]": "YES"
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphoneos*]": "YES"
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphonesimulator*]": "YES"
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphoneos*]": "YES"
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphonesimulator*]": "YES"
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": "YES"
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]":
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.j23n.TimeTracker
        PRODUCT_MODULE_NAME: TimeTracker
        PRODUCT_NAME: "Time Tracker"
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # The Mac's Debug builds may reach the network, for in-app feedback (README.md,
        # "Feedback"); release builds don't.
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/TimeTracker-macOS-Debug.entitlements
        Release:
          VALIDATE_PRODUCT: "YES"

  # The Live Activity and the controls, for iOS.
  TimeTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    # The build number: the number of commits, set when the bundle is built (j23n/apple-ci
    # README.md, "Build numbers"). The script reads .git, hence no script sandbox here.
    postBuildScripts:
      - name: Build number
        script: '"$SRCROOT/.apple-ci/build-number.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    dependencies:
      - package: TrackerKit
        product: TimerActivity
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Time Tracker"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.j23n.TimeTracker.Widgets
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: iphoneos
        SKIP_INSTALL: "YES"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "WIDGET_EXTENSION $(inherited)"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          VALIDATE_PRODUCT: "YES"

schemes:
  TimeTracker:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        TimeTracker: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
